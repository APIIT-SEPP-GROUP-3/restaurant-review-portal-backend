name: Backend CI

on:
  push:
    branches:
      - main
      - master/develop

  pull_request:
    branches:
      - main
      - master/develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backend_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: restaurant_review_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_test -d restaurant_review_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://backend_test:ci_test_only@localhost:5432/restaurant_review_portal_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: TypeScript build
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Run tests
        run: npm test
