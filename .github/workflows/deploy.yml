name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$SERVER_SSH_KEY" > ~/.ssh/dinerate_deploy_key
          chmod 600 ~/.ssh/dinerate_deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/dinerate_deploy_key "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e

            echo "Updating backend repository..."
            cd /opt/dinerate/backend

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "Rebuilding backend container..."
            cd /opt/dinerate
            docker compose up -d --build backend

            echo "Waiting for backend..."
            sleep 10

            echo "Checking backend health..."
            curl --fail http://127.0.0.1:5001/api/health

            echo "Backend deployment completed."
          EOF